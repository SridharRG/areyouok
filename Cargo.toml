[package]
name = "areyouok"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "areyouok"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
regex = "1.10"
walkdir = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
url = "2.5"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
